packages:
  - "apps/*"
  - "packages/*"
allowBuilds:
  argon2: true
  prisma: true
  "@prisma/client": true
  "@prisma/engines": true
  esbuild: true
  cpu-features: false
  ssh2: false
  protobufjs: false
overrides:
  deepmerge-ts: "^8.0.0"
  # Security fixes for transitive dependencies (pnpm audit, 31 Oct 2026).
  body-parser: ">=2.4.0 <3"
  qs: ">=6.16.1 <7"
  ip-address: ">=10.7.4 <11"
  follow-redirects: ">=1.16.2 <2"
auditConfig:
  ignoreGhsas:
    # zod 3 memory exhaustion on oversized constrained collections: fixed only in zod 4, which this
    # codebase (and zod-to-openapi 7) doesn't use yet. Request bodies are capped at 50 KB (200 KB for
    # employee import) before zod sees them, which bounds the input. Revisit when moving to zod 4.
    - GHSA-mrhx-c7xc-m3w5
